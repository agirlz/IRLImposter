<!doctype html>
<html lang="en" class="task-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steady Hand</title>
<link rel="stylesheet" href="../style.css">
<style>
  body{ touch-action: none; }
  .track{
    position: relative; height: 64px; border-radius: 12px;
    background: var(--seam); box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
    margin: 18px 0 10px; overflow: hidden;
  }
  .zone{
    position: absolute; top: 0; bottom: 0; background: rgba(61,220,132,0.25);
    border-left: 2px solid var(--good); border-right: 2px solid var(--good);
  }
  .needle{
    position: absolute; top: -4px; bottom: -4px; width: 10px; margin-left: -5px;
    background: var(--accent); border-radius: 6px;
    box-shadow: 0 0 10px rgba(255,176,32,0.6);
  }
  .done-banner{
    text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 700;
    font-size: 22px; color: var(--good); margin-top: 10px; display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Maintenance Task</div>
  <h1 class="title">Steady Hand</h1>
  <div class="panel">
    <p class="hint center">Drag the needle and hold it inside the green zone as it drifts.</p>
    <div class="track" id="track">
      <div class="zone" id="zone"></div>
      <div class="needle" id="needle"></div>
    </div>
    <div class="progress-bar"><div id="progBar" style="width:0%"></div></div>
    <p class="hint center mt" id="statusText">0.0s / 5.0s steady</p>
    <div class="done-banner" id="doneBanner">STABILIZED</div>
  </div>
</div>
<script>
  var track = document.getElementById("track");
  var zone = document.getElementById("zone");
  var needle = document.getElementById("needle");
  var progBar = document.getElementById("progBar");
  var statusText = document.getElementById("statusText");
  var doneBanner = document.getElementById("doneBanner");

  var GOAL = 5.0;
  var ZONE_HALF = 9; // percent
  var needlePos = 50;
  var progress = 0;
  var done = false;
  var t0 = performance.now();
  var last = null;
  var dragging = false;

  function zoneCenter(t){
    var c = 50 + Math.sin(t * 0.55) * 24 + Math.sin(t * 1.35 + 1) * 9;
    return Math.max(ZONE_HALF + 2, Math.min(100 - ZONE_HALF - 2, c));
  }

  function setFromClientX(clientX){
    var rect = track.getBoundingClientRect();
    var pct = ((clientX - rect.left) / rect.width) * 100;
    needlePos = Math.max(0, Math.min(100, pct));
  }

  track.addEventListener("pointerdown", function(e){ dragging = true; setFromClientX(e.clientX); });
  window.addEventListener("pointermove", function(e){ if (dragging) setFromClientX(e.clientX); });
  window.addEventListener("pointerup", function(){ dragging = false; });

  function frame(ts){
    if (done) return;
    if (last === null) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    var t = (ts - t0) / 1000;

    var c = zoneCenter(t);
    zone.style.left = (c - ZONE_HALF) + "%";
    zone.style.width = (ZONE_HALF * 2) + "%";
    needle.style.left = needlePos + "%";

    var inZone = Math.abs(needlePos - c) <= ZONE_HALF;
    progress += inZone ? dt : -dt * 0.4;
    progress = Math.max(0, Math.min(GOAL, progress));

    progBar.style.width = (progress / GOAL * 100) + "%";
    statusText.textContent = progress.toFixed(1) + "s / " + GOAL.toFixed(1) + "s steady";

    if (progress >= GOAL){
      complete();
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function complete(){
    done = true;
    doneBanner.style.display = "block";
    setTimeout(function(){
      try{
        if (window.parent && window.parent !== window){
          window.parent.postMessage({ type: "task-complete", task: "steady-hand" }, "*");
        }
      }catch(e){}
    }, 900);
  }
</script>
</body>
</html>
