<!doctype html>
<html lang="en" class="task-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Code</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* The code and the keypad never show at the same time: you memorize it,
     then the keypad takes its place. That's what lets this fit a short
     screen, and the code has to be out of sight once you're entering it. */
  .code-display{
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 52px;
    letter-spacing: 0.3em; text-align: center; color: var(--accent);
    background: var(--seam); border-radius: 12px; padding: 18px 0;
    margin: 14px 0; font-variant-numeric: tabular-nums;
  }
  .keypad{ display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 6px; margin-top: 6px; }
  .keypad button{ font-size: 20px; padding: 0; min-height: 0; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
  .entry-display{
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 28px;
    letter-spacing: 0.3em; text-align: center; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .done-banner{
    text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 700;
    font-size: 22px; color: var(--good); margin-top: 10px; display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Maintenance Task</div>
  <h1 class="title">Access Code</h1>
  <div class="panel">
    <p class="hint center" id="promptText">Memorize this code…</p>
    <div class="code-display" id="codeDisplay">----</div>
    <div class="entry-display" id="entryDisplay" hidden>····</div>
    <div class="keypad grow" id="keypad" hidden></div>
    <div class="done-banner" id="doneBanner">ACCESS GRANTED</div>
  </div>
</div>
<script>
  var codeDisplay = document.getElementById("codeDisplay");
  var entryDisplay = document.getElementById("entryDisplay");
  var keypad = document.getElementById("keypad");
  var promptText = document.getElementById("promptText");
  var doneBanner = document.getElementById("doneBanner");

  var CODE_LEN = 4;
  var MEMORIZE_MS = 3200;
  var code = "";
  var entry = "";
  var done = false;

  function newCode(){
    code = "";
    for (var i = 0; i < CODE_LEN; i++) code += Math.floor(Math.random() * 10);
    entry = "";
    codeDisplay.textContent = code;
    codeDisplay.hidden = false;
    entryDisplay.hidden = true;
    keypad.hidden = true;
    promptText.textContent = "Memorize this code…";

    setTimeout(function(){
      renderEntry();
      codeDisplay.hidden = true;
      entryDisplay.hidden = false;
      keypad.hidden = false;
      promptText.textContent = "Enter the code from memory";
    }, MEMORIZE_MS);
  }

  function buildKeypad(){
    var keys = ["1","2","3","4","5","6","7","8","9","clear","0","back"];
    keys.forEach(function(k){
      var b = document.createElement("button");
      b.textContent = k === "clear" ? "CLR" : (k === "back" ? "⌫" : k);
      b.addEventListener("click", function(){ onKey(k); });
      keypad.appendChild(b);
    });
  }

  function renderEntry(){
    var shown = entry.split("").join(" ");
    var placeholders = "· ".repeat(CODE_LEN - entry.length).trim();
    entryDisplay.textContent = (shown + " " + placeholders).trim();
  }

  function onKey(k){
    if (done) return;
    if (k === "clear"){ entry = ""; renderEntry(); return; }
    if (k === "back"){ entry = entry.slice(0, -1); renderEntry(); return; }
    if (entry.length >= CODE_LEN) return;
    entry += k;
    renderEntry();
    if (entry.length === CODE_LEN){
      if (entry === code){
        complete();
      } else {
        promptText.textContent = "Incorrect — new code coming up.";
        setTimeout(newCode, 900);
      }
    }
  }

  buildKeypad();
  newCode();

  function complete(){
    done = true;
    promptText.textContent = "";
    entryDisplay.hidden = true;
    keypad.hidden = true;
    doneBanner.style.display = "block";
    setTimeout(function(){
      try{
        if (window.parent && window.parent !== window){
          window.parent.postMessage({ type: "task-complete", task: "access-code" }, "*");
        }
      }catch(e){}
    }, 900);
  }
</script>
</body>
</html>
