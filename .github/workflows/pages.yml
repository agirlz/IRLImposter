name: Publish online version

# Every push to main publishes public/ to GitHub Pages, switched to online
# mode (Supabase relay + room codes). The offline server and the Android app
# use the same files with online mode left off.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch on online mode
        run: |
          sed -i 's/^  online: false,$/  online: true,/' public/config.js
          grep -q '^  online: true,$' public/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
